name: Build and deploy ASP app to Azure Web App - WebApp1-12851

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2.0.1

      - name: Restore NuGet Packages
        run: nuget restore your-solution-file.sln # FIXME: Replace with your actual .sln file name

      - name: Build and Package Web Application
        run: |
          msbuild your-solution-file.sln /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=false /p:OutDir=../build_output/ /p:DeployDefaultTarget=WebPublish
        # Note: Replace 'your-solution-file.sln' with your actual solution or .csproj file name.

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: aspnet35-app
          path: build_output/_PublishedWebsites/ # MSBuild places the deployable web files here

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: aspnet35-app
          path: ./publish

      - name: Deploy to Azure Web App (Windows)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
